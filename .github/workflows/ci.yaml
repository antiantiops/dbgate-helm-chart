name: Helm chart CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: lint and render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: helm lint dbgate
      - name: Render all templates
        run: |
          helm template dbgate dbgate --namespace dbgate > /tmp/dbgate-manifests.yaml
          test -s /tmp/dbgate-manifests.yaml
