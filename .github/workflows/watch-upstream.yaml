name: Watch upstream Docker image

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}

concurrency:
  group: watch-upstream
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get current appVersion from Chart.yaml
        id: current
        run: |
          current="$(grep '^appVersion:' dbgate/Chart.yaml | sed 's/appVersion: *"\?\([^"]*\)"\?/\1/')"
          echo "version=$current" >> "$GITHUB_OUTPUT"

      - name: Fetch latest stable tag from Docker Hub
        id: latest
        run: |
          set -euo pipefail
          # Get tags from Docker Hub, filter semver (X.Y.Z), sort descending, pick first
          latest="$(curl -sS 'https://hub.docker.com/v2/repositories/dbgate/dbgate/tags/?page_size=100&ordering=last_updated' \
            | jq -r '.results[].name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -rV \
            | head -n1)"
          if [[ -z "$latest" ]]; then
            echo "No stable tag found" >&2
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          if [[ "$CURRENT" == "$LATEST" ]]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $CURRENT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
            echo "Update available: $CURRENT → $LATEST"
          fi

      - name: Update Chart.yaml and values.yaml
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^appVersion: .*/appVersion: \"${LATEST}\"/" dbgate/Chart.yaml
          sed -i -E "s/^  tag: .*/  tag: \"${LATEST}\"/" dbgate/values.yaml
          grep "appVersion:" dbgate/Chart.yaml
          grep "tag:" dbgate/values.yaml

      - name: Commit and push
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          CURRENT: ${{ steps.current.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dbgate/Chart.yaml dbgate/values.yaml
          git commit -m "chore: bump dbgate ${CURRENT} → ${LATEST}"
          git push origin HEAD:main

      - name: Trigger release workflow
        if: steps.compare.outputs.up_to_date == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/release-chart.yaml/dispatches" \
            -d '{"ref":"main"}'
